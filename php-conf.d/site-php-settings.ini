post_max_size=20M
; upload_max_filesize было не задано — PHP тихо берёт свой дефолт (2M),
; который меньше нашего собственного лимита на фото оттенка (4M,
; ShadePaletteController). Файл больше 2M PHP резал ещё до Laravel-валидации
; (правило "uploaded"), и т.к. этого ключа не было в lang/ro,ru/validation.php,
; пользователь видел сырой ключ "validation.uploaded" вместо понятного
; сообщения о размере. См. efrumos-docs/tasks-status.md, баги от тестировщика
; 2026-09-14.
upload_max_filesize=20M
max_execution_time=0
